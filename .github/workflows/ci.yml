name: Project Quality Gate

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    name: Repository Governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce main receives only develop
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "PRs to main must come from develop."
            exit 1
          fi

      - name: Block local-only tracked files
        run: |
          set -euo pipefail
          blocked="$(git ls-files localDocs external temp .codex .run || true)"
          if [ -n "$blocked" ]; then
            echo "The following local-only files are tracked and must be removed:"
            echo "$blocked"
            exit 1
          fi

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend-tests:
    name: Backend And CI-Safe Tests
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt

      - name: Check backend imports
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "backend")
          from main import create_app
          app = create_app()
          assert app.routes
          PY

      - name: Run CI-safe pytest suite
        run: python -m pytest Testing/tests -m "not aut_api and not ragas and not llm" -q -p no:cacheprovider
